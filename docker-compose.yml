services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pingo-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-pingo}
      PINGO_API_PASSWORD: ${PINGO_API_PASSWORD:-pingo-api-local-only}
      PINGO_WORKER_PASSWORD: ${PINGO_WORKER_PASSWORD:-pingo-worker-local-only}
    volumes:
      - pingo-db:/var/lib/postgresql/data
      - ./backend/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pingo} -d ${POSTGRES_DB:-pingo}"]
      interval: 5s
      timeout: 3s
      retries: 15

  db-roles:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap/001-tenant-roles.sh"]
    environment:
      PGHOST: db
      PGPORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pingo-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-pingo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pingo-local-only}
      PINGO_API_PASSWORD: ${PINGO_API_PASSWORD:-pingo-api-local-only}
      PINGO_WORKER_PASSWORD: ${PINGO_WORKER_PASSWORD:-pingo-worker-local-only}
    volumes:
      - ./backend/initdb/001-tenant-roles.sh:/bootstrap/001-tenant-roles.sh:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    image: pingo-api:local
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PINGO_ENVIRONMENT: ${PINGO_ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pingo_api:${PINGO_API_PASSWORD:-pingo-api-local-only}@db:5432/${POSTGRES_DB:-pingo}}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-this-secret-before-deploying}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:19006}
      PRIVATE_UPLOAD_ROOT: /app/private_uploads
      MAX_UPLOAD_BYTES: 20971520
      AI_PROVIDER: ${AI_PROVIDER:-none}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    volumes:
      - pingo-uploads:/app/private_uploads
    ports:
      - "${PINGO_API_BIND_HOST:-127.0.0.1}:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 5

  migrate:
    build: ./backend
    image: pingo-api:local
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATIONS_DATABASE_URL: ${MIGRATIONS_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-pingo}:${POSTGRES_PASSWORD:-pingo-local-only}@db:5432/${POSTGRES_DB:-pingo}}
    depends_on:
      db-roles:
        condition: service_completed_successfully

  notification-worker:
    build: ./backend
    image: pingo-api:local
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      PINGO_ENVIRONMENT: ${PINGO_ENVIRONMENT:-development}
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql+psycopg://pingo_worker:${PINGO_WORKER_PASSWORD:-pingo-worker-local-only}@db:5432/${POSTGRES_DB:-pingo}}
      EXPO_PUSH_ACCESS_TOKEN: ${EXPO_PUSH_ACCESS_TOKEN:-}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai-local"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - pingo-ollama:/root/.ollama

volumes:
  pingo-db:
  pingo-uploads:
  pingo-ollama:

